---
- hosts: localhost
  become: true
  vars:
    packages:
      - cifs-utils
      - exfatprogs
      - eza
      - figlet
      - firefox
      - fonts-font-awesome
      - fzf
      - git
      - gnome-screenshot
      - gnome-tweaks
      - htop
      - jq
      - neofetch
      - neovim
      - openssh-server
      - pipx
      - podman
      - pwgen
      - terraform
      - timeshift
      - vlc
      - xclip
      - xdg-user-dirs
      - zsh

  tasks:
    - name: Install apt packages
      apt:
        name: "{{ packages }}"
        state: latest
        update_cache: yes
