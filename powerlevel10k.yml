- hosts: localhost
  gather_facts: true

  vars:
    home_dir: "{{ lookup('env','HOME') }}"
    p10k_dir: "{{ home_dir }}/powerlevel10k"
    zsh_autosuggestions_path: "{{ home_dir }}/.zsh/zsh-autosuggestions"
    zshrc_path: "{{ home_dir }}/.zshrc"
    xremap_config_dir: "{{ home_dir }}/.config/xremap"
    systemd_user_dir: "{{ home_dir }}/.config/systemd/user"

  tasks:
    - name: Ensure zsh is installed
      become: true
      apt:
        name: zsh
        state: present
        update_cache: yes

    - name: Ensure .zsh directory exists
      file:
        path: "{{ home_dir }}/.zsh"
        state: directory
        mode: "0755"

    - name: Clone Powerlevel10k repo
      git:
        repo: https://github.com/romkatv/powerlevel10k.git
        dest: "{{ p10k_dir }}"
        depth: 1
        update: yes

    - name: Clone zsh-autosuggestions repo
      git:
        repo: https://github.com/zsh-users/zsh-autosuggestions
        dest: "{{ zsh_autosuggestions_path }}"
        depth: 1
        update: yes

    - name: Configure .zshrc block
      blockinfile:
        path: "{{ zshrc_path }}"
        marker: "# {mark} ANSIBLE_MANAGED_P10K"
        create: yes
        insertafter: EOF
        block: |
          if [[ -r "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh" ]]; then
            source "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh"
          fi

          [[ -f "{{ p10k_dir }}/powerlevel10k.zsh-theme" ]] && source "{{ p10k_dir }}/powerlevel10k.zsh-theme"
          [[ -f ~/.p10k.zsh ]] && source ~/.p10k.zsh
          [[ -f ~/.zsh_aliases ]] && source ~/.zsh_aliases
          [[ -f ~/.zsh_exports ]] && source ~/.zsh_exports
          [[ -f "{{ zsh_autosuggestions_path }}/zsh-autosuggestions.zsh" ]] && source "{{ zsh_autosuggestions_path }}/zsh-autosuggestions.zsh"

          HISTFILE=~/.zsh_history
          HISTSIZE=10000
          SAVEHIST=10000
          setopt appendhistory

    - name: Change default shell to zsh
      become: true
      user:
        name: "{{ ansible_facts.user_id }}"
        shell: /usr/bin/zsh

    # -----------------------------
    # XREMAP INSTALL
    # -----------------------------

    - name: Download xremap
      get_url:
        url: https://github.com/xremap/xremap/releases/download/v0.14.2/xremap-linux-x86_64-gnome.zip
        dest: /tmp/xremap.zip
        mode: "0644"

    - name: Install xremap binary
      become: true
      unarchive:
        src: /tmp/xremap.zip
        dest: /usr/local/bin
        remote_src: yes
        creates: /usr/local/bin/xremap
        mode: "0755"

    - name: Ensure xremap config directory exists
      file:
        path: "{{ xremap_config_dir }}"
        state: directory
        mode: "0755"

    - name: Write xremap config
      copy:
        dest: "{{ xremap_config_dir }}/config.yml"
        mode: "0644"
        content: |
          ---
          keymap:
            - name: TildeFix
              remap:
                102nd: grave

    - name: Ensure systemd user directory exists
      file:
        path: "{{ systemd_user_dir }}"
        state: directory
        mode: "0755"

    - name: Write xremap systemd service
      become: true
      copy:
        dest: /etc/systemd/system/xremap.service
        content: |
          [Unit]
          Description=xremap key remapping
          After=graphical.target
          PartOf=graphical.target

          [Service]
          ExecStart=/usr/local/bin/xremap /root/.config/xremap/config.yml --device /dev/input/event3
          Restart=on-failure
          RestartSec=2
          Type=simple
          User=root

          [Install]
          WantedBy=graphical.target
        mode: 0644

    - name: Reload systemd daemon
      command: systemctl --user daemon-reload

    - name: Enable xremap service
      command: systemctl --user enable xremap.service

    - name: Start xremap service
      command: systemctl --user restart xremap.service

    # -----------------------------
    # ZSH ALIASES / EXPORTS
    # -----------------------------

    - name: Write .zsh_aliases
      copy:
        dest: "{{ home_dir }}/.zsh_aliases"
        mode: "0644"
        content: |
          alias ls='eza -a --icons=always'
          alias la='eza -lia --icons=always'
          alias ll='eza -l --icons=always'
          alias lt='eza --tree --level=1 --icons=always'
          alias cl='clear'
          alias home='cd ~/'
          alias py='python3'
          alias rs='exec $SHELL -l'

    - name: Write .zsh_exports
      copy:
        dest: "{{ home_dir }}/.zsh_exports"
        mode: "0644"
        content: |
          export DOCKER_HOST=unix:///run/user/1000/docker.sock
          export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
          export PATH=$PATH:/usr/local/go/bin
          export GOPATH=~/go
          export PATH="$PATH:$(go env GOPATH)/bin"
          export N_PREFIX="$HOME/n"; [[ :$PATH: == *":$N_PREFIX/bin:"* ]] || PATH+=":$N_PREFIX/bin"
          export PYTHONPATH="$PWD/lib:$PYTHONPATH"
          export PATH="$PATH:$HOME/.local/bin"
