---
- name: cursor
  hosts: localhost
  tasks:
    - name: Download cursor package
      ansible.builtin.get_url:
        url: https://api2.cursor.sh/updates/download/golden/linux-x64-deb/cursor/
        dest: "{{ ansible_facts['env']['HOME'] }}/Downloads/cursor.deb"
      become: false

    - name: Install curosor .deb package
      ansible.builtin.apt:
        deb: "{{ ansible_facts['env']['HOME'] }}/Downloads/cursor.deb"
      become: true

- name: vscode
  hosts: localhost
  tasks:
    - name: Download vscode package
      ansible.builtin.get_url:
        url: https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64
        dest: "{{ ansible_facts['env']['HOME'] }}/Downloads/vscode.deb"
      become: false

    - name: Install vscode .deb package
      ansible.builtin.apt:
        deb: "{{ ansible_facts['env']['HOME'] }}/Downloads/vscode.deb"
      become: true

- name: Google Chrome
  hosts: localhost
  tasks:
    - name: Download google chrome package
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        dest: "{{ ansible_facts['env']['HOME'] }}/Downloads/google-chrome.deb"
      become: false

    - name: Install google chrome .deb package
      ansible.builtin.apt:
        deb: "{{ ansible_facts['env']['HOME'] }}/Downloads/google-chrome.deb"
      become: true
