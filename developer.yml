---
- name: Add launcher
  become: true
  hosts: localhost
  tasks:
    - name: Add repository universe
      shell: |
        add-apt-repository universe -y
        add-apt-repository ppa:agornostal/ulauncher -y

- name: .NET Runtime
  hosts: localhost
  tasks:
    - name: Download .NET runtime
      ansible.builtin.get_url:
        force: true
        mode: 0755
        dest: "{{ ansible_env.HOME }}/Downloads/dotnet-install.sh"
        url: https://dot.net/v1/dotnet-install.sh
      become: false

    - name: Install .NET runtime
      ansible.builtin.shell: >
        bash "{{ ansible_env.HOME }}/Downloads/dotnet-install.sh"
        --install-dir /usr/share/dotnet
        --version 8.0.415
      args:
        creates: /usr/share/dotnet/dotnet
      environment:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
      become: true

- name: Golang
  hosts: localhost
  tasks:
    - name: Download golang
      ansible.builtin.get_url:
        force: true
        mode: 0755
        dest: /tmp/go1.25.3.linux-amd64.tar.gz
        url: https://go.dev/dl/go1.25.3.linux-amd64.tar.gz
      become: false

    - name: Install golang
      become: true
      shell: |
        rm -rf /usr/local/go
        tar -C /usr/local -xzf /tmp/go1.25.3.linux-amd64.tar.gz
      args:
        creates: /usr/local/go/bin/go
        executable: /bin/bash

    - name: Verify go version
      command: /usr/local/go/bin/go version
      register: go_ver
      changed_when: false

    - name: Display go version
      debug:
        msg: "{{ go_ver.stdout }}"

    - name: Add terraform repository
      become: true
      copy:
        dest: /etc/apt/sources.list.d/hashicorp.list
        content: |
          deb [arch=amd64 signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com noble main
        mode: 0644

    - name: Download Hashicorp's GPG key
      become: true
      shell: |
        wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null

    - name: Verify Hashicorp's GPG fingerprint
      shell: |
        gpg --no-default-keyring \
          --keyring /usr/share/keyrings/hashicorp-archive-keyring.gpg \
          --fingerprint
      register: gpg_details
      changed_when: false

    - name: Display Hashicorp's GPG
      debug:
        msg: "{{ gpg_details.stdout }}"
