---
- name: Add launcher
  become: true
  hosts: localhost
  tasks:
    - name: Add repository universe
      shell: |
        add-apt-repository universe -y
        add-apt-repository ppa:agornostal/ulauncher -y

- name: AWS CLI
  hosts: localhost
  tasks:
    - name: Download awscli
      get_url:
        dest: /tmp/awscliv2.zip
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        mode: 0644
        force: false

    - name: Create temp folder
      file:
        path: /tmp/awscliv2
        state: directory
        mode: 0755

    - name: Extract awscli
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp/awscliv2
        remote_src: yes
        creates: /tmp/awscliv2/aws/install

    - name: Run bundled installer
      become: true
      command: /tmp/awscliv2/aws/install -i /usr/local/aws-cli -b /usr/local/bin
      args:
        creates: /usr/local/bin/aws

- name: Golang
  hosts: localhost
  tasks:
    - name: Download golang
      get_url:
        force: false
        mode: 0755
        dest: /tmp/go1.25.3.linux-amd64.tar.gz
        url: https://go.dev/dl/go1.25.3.linux-amd64.tar.gz
      become: false

    - name: Install golang
      become: true
      shell: |
        rm -rf /usr/local/go
        tar -C /usr/local -xzf /tmp/go1.25.3.linux-amd64.tar.gz
      args:
        creates: /usr/local/go/bin/go
        executable: /bin/bash

    - name: Add terraform repository
      become: true
      copy:
        dest: /etc/apt/sources.list.d/hashicorp.list
        content: |
          deb [arch=amd64 signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com noble main
        mode: 0644

    - name: Download Hashicorp's GPG key
      become: true
      shell: |
        wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null

    - name: Verify Hashicorp's GPG fingerprint
      shell: |
        gpg --no-default-keyring \
          --keyring /usr/share/keyrings/hashicorp-archive-keyring.gpg \
          --fingerprint
      register: gpg_details
      changed_when: false

- name: Install nvm
  hosts: localhost
  tasks:
    - name: Download nvm script
      get_url:
        url: https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh
        dest: /tmp/nvm-install.sh
        mode: 0755

    - name: Run nvm install
      ansible.builtin.command:
        argv:
          - bash
          - /tmp/nvm-install.sh

- name: Install Zed editor
  hosts: localhost
  tasks:
    - name: Download Zed install script
      get_url:
        url: https://zed.dev/install.sh
        dest: /tmp/zed-install.sh
        mode: "0755"

    - name: Run Zed install script
      command: bash /tmp/zed-install.sh
      args:
        creates: "{{ lookup('env', 'HOME') }}/.local/bin/zed"
      become: false

- name: Install Claude Desktop
  hosts: localhost
  become: true
  tasks:
    - name: Install curl and gnupg
      apt:
        name:
          - curl
          - gnupg
        state: present

    - name: Download Anthropic's signing key
      get_url:
        url: https://downloads.claude.ai/claude-desktop/key.asc
        dest: /usr/share/keyrings/claude-desktop-archive-keyring.asc
        mode: 0644

    - name: Add Claude Desktop apt repository
      copy:
        dest: /etc/apt/sources.list.d/claude-desktop.list
        content: |
          deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/claude-desktop-archive-keyring.asc] https://downloads.claude.ai/claude-desktop/apt/stable stable main
        mode: 0644

    - name: Install claude-desktop package
      apt:
        name: claude-desktop
        state: present
        update_cache: yes
